defaults:
  - /tictactoe/agentic_train_tictactoe_minimax_selfplay_2gpu@_global_
  - _self_

hydra:
  searchpath:
    - file://${oc.env:PWD}/examples

exp_name: "geography_root_rollout_pilot"

# Generation-only depth pilot: 30 held-out graphs, with 32 independent
# stochastic responses to the identical prompt for each graph.
max_steps: 1
game_step_discount: 1.0
rollout_batch_size: 960
sequence_length: 4096
max_actions_per_traj: 1
num_gpus_per_node: 1

actor_train:
  device_mapping: list(range(0,1))

reference:
  device_mapping: list(range(0,1))

actor_infer:
  generating_args:
    max_new_tokens: 1200
    top_p: 0.8
    top_k: 20
    num_beams: 1
    temperature: 0.7
    num_return_sequences: 1
    stop: ["</answer>"]
    include_stop_str_in_output: true
  strategy_args:
    strategy_config:
      tensor_parallel_size: 1
      max_model_len: 4096
      gpu_memory_utilization: 0.8
  device_mapping: list(range(0,1))

enable_think: false
markovian_turn_context: true
use_reason_answer_format: true

custom_envs:
  Geography-Rollout-Distance-1:
    env_type: geography
    max_actions_per_traj: 1
    grid_vocab: false
    env_config:
      built_in_opponent: none
      reward_mode: environment
      root_decision_only: true
      response_token_limit: 1200
      seed_namespace: 101
      num_nodes: 12
      min_depth: 4
      max_depth: 6
      min_branching: 1
      max_branching: 3
      transposition_rate: 0.15
      target_root_informative: true
      target_root_optimal_distance: 1
      target_root_branching: 2
      target_informative_fraction: 0.5
      generator_candidates: 8192

  Geography-Rollout-Distance-3:
    env_type: geography
    max_actions_per_traj: 1
    grid_vocab: false
    env_config:
      built_in_opponent: none
      reward_mode: environment
      root_decision_only: true
      response_token_limit: 1200
      seed_namespace: 102
      num_nodes: 12
      min_depth: 4
      max_depth: 6
      min_branching: 1
      max_branching: 3
      transposition_rate: 0.15
      target_root_informative: true
      target_root_optimal_distance: 3
      target_root_branching: 2
      target_informative_fraction: 0.5
      generator_candidates: 8192

  Geography-Rollout-Distance-5:
    env_type: geography
    max_actions_per_traj: 1
    grid_vocab: false
    env_config:
      built_in_opponent: none
      reward_mode: environment
      root_decision_only: true
      response_token_limit: 1200
      seed_namespace: 103
      num_nodes: 12
      min_depth: 4
      max_depth: 6
      min_branching: 1
      max_branching: 3
      transposition_rate: 0.15
      target_root_informative: true
      target_root_optimal_distance: 5
      target_root_branching: 2
      target_informative_fraction: 0.5
      generator_candidates: 8192

train_env_manager:
  # No retry or auxiliary reward is used in this measurement-only run.
  max_invalid_retries_per_decision: 0
  format_penalty: 0.0
  minimax_length_penalty_beta: 0.0
  minimax_length_soft_budget: 1000
  minimax_length_hard_budget: 1200
  enable_length_penalty: false
  # Pack five 32-sample graph groups into each process. This preserves the
  # identical-prompt sampling design while avoiding 15 duplicated Ray runtimes.
  max_env_num_per_worker: 160
  env_groups: 30
  group_size: 32
  group_seed_base: 700000
  tags:
    - Geography-Rollout-Distance-1
    - Geography-Rollout-Distance-3
    - Geography-Rollout-Distance-5
  n_groups: [10, 10, 10]
