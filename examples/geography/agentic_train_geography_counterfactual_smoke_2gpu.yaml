defaults:
  - agentic_train_geography_counterfactual_selfplay_2gpu
  - _self_

exp_name: "geography_counterfactual_smoke_2gpu"
max_steps: 20
eval_steps: 5
save_steps: 1000000
rollout_batch_size: 8
val_batch_size: 16

actor_train:
