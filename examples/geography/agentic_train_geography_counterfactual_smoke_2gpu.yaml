    warmup_steps: 0

train_env_manager:
  max_env_num_per_worker: 4
  env_groups: 4
  n_groups: [4]

val_env_manager:
  max_env_num_per_worker: 16
  env_groups: 16
  n_groups: [2, 2, 2, 2, 2, 2, 2, 2]

