# @package _global_

defaults:
  - agentic_train_geography_counterfactual_distance3_2gpu
  - _self_

exp_name: "geography_counterfactual_distance3_smoke_2gpu"
max_steps: 20
eval_steps: 5
rollout_batch_size: 8
val_batch_size: 12

actor_train:
  training_args:
    warmup_steps: 0

custom_envs:
  Geography-Val-D3-IID-P1:
    env_config:
      # Smoke has two IID groups immediately before its two role copies.
      seed_offset: -2
  Geography-Val-D3-Relabel:
    env_config:
      # Relabel follows two IID groups and two role-invariance copies.
      seed_offset: -4

train_env_manager:
  max_env_num_per_worker: 8
  env_groups: 8
  n_groups: [2, 2, 2, 2]

val_env_manager:
  max_env_num_per_worker: 6
  env_groups: 12
  n_groups: [2, 2, 2, 2, 2, 2]
