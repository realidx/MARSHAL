# @package _global_

defaults:
  - agentic_train_geography_root_d3_5_2gpu
  - _self_

exp_name: "geography_root_grpo_d3_5_2gpu"

# Agentic GRPO uses REINFORCE returns after the combined response reward is
# standardized within the eight samples generated from the identical prompt.
adv_estimator: grpo
reward_normalization:
  grouping: traj_group_id
  method: mean_std
  separate_norm_for_selfplay: false
