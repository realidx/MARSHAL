# @package _global_

defaults:
  - agentic_train_geography_counterfactual_selfplay_2gpu
  - _self_

exp_name: "geography_counterfactual_distance3_2gpu"

# First causal training experiment: exact local counterfactual credit on
# procedurally fresh Distance-3 roots, with full-game self-play thereafter.
max_steps: 100
eval_steps: 20
eval_at_end: true
rollout_batch_size: 32
val_batch_size: 48
sequence_length: 4096
max_actions_per_traj: 6

actor_infer:
  generating_args:
    max_new_tokens: 1200
    stop: ["</answer>"]
    include_stop_str_in_output: true
  strategy_args:
    strategy_config:
      max_model_len: 4096

custom_envs:
  Geography-Train-D3-N10-LowShare:
    env_type: geography
    max_actions_per_traj: ${max_actions_per_traj}
    grid_vocab: false
    env_config:
      built_in_opponent: none
      render_mode: text
      reward_mode: counterfactual
      game_step_discount: ${game_step_discount}
      root_decision_only: false
      response_token_limit: 1200
      seed_namespace: 201
      num_nodes: 10
      min_depth: 4
      max_depth: 6
      min_branching: 1
      max_branching: 3
      transposition_rate: 0.05
      target_root_informative: true
      target_root_optimal_distance: 3
      target_root_branching: 2
      target_informative_fraction: 0.5
      generator_candidates: 1024

  Geography-Train-D3-N10-HighShare:
    env_type: geography
    max_actions_per_traj: ${max_actions_per_traj}
    grid_vocab: false
    env_config:
      built_in_opponent: none
      render_mode: text
      reward_mode: counterfactual
      game_step_discount: ${game_step_discount}
      root_decision_only: false
      response_token_limit: 1200
      seed_namespace: 202
      num_nodes: 10
      min_depth: 4
      max_depth: 6
      min_branching: 1
      max_branching: 3
      transposition_rate: 0.35
      target_root_informative: true
      target_root_optimal_distance: 3
      target_root_branching: 2
      target_informative_fraction: 0.5
      generator_candidates: 1024

