train_env_manager:
  max_invalid_retries_per_decision: 0
  format_penalty: -1.5
  minimax_length_penalty_beta: 0.0
  minimax_length_soft_budget: 1000
  minimax_length_hard_budget: 1200
  enable_length_penalty: false
  max_env_num_per_worker: 8
  env_groups: 32
  group_size: 1
  group_seed_base: 100000
  tags:
    - Geography-Train-D3-N10-LowShare
    - Geography-Train-D3-N10-HighShare
    - Geography-Train-D3-N14-LowShare
    - Geography-Train-D3-N14-HighShare
  n_groups: [8, 8, 8, 8]

val_env_manager:
  max_invalid_retries_per_decision: 0
  format_penalty: 0.0
  minimax_length_penalty_beta: 0.0
  minimax_length_soft_budget: 1000
  minimax_length_hard_budget: 1200
  enable_length_penalty: false
  max_env_num_per_worker: 8
  env_groups: 48
  group_size: 1
  group_seed_base: 800000
  tags:
    - Geography-Val-D1-Sanity
    - Geography-Val-D3-IID
    - Geography-Val-D3-Relabel
    - Geography-Val-D3-Topology-OOD
    - Geography-Val-D5-ZeroShot
    - Geography-Val-D3-FullGame
  n_groups: [8, 8, 8, 8, 8, 8]
