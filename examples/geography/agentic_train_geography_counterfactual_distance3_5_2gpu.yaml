  # Sixteen graph groups per suite require larger offsets than the inherited
  # eight-graph validation setup to preserve exact role and relabel pairing.
  Geography-Val-D3-IID-P1:
    env_config:
      seed_offset: -16

  Geography-Val-D3-Relabel:
    env_config:
      seed_offset: -32

  # Fixed seeds 800117 and 800118 only satisfy the requested topology after
  # 2,048 candidates. Keep the hard OOD target and enlarge the deterministic
  # search budget instead of silently substituting easier validation graphs.
  Geography-Val-D3-Topology-OOD:
    env_config:
      generator_candidates: 4096

  Geography-Val-D5-HeldOut:
    env_type: geography
    max_actions_per_traj: 1
    grid_vocab: false
    env_config:
