# @package _global_

defaults:
  - agentic_train_geography_counterfactual_distance3_2gpu
  - _self_

exp_name: "geography_counterfactual_distance3_5_2gpu"

# Balanced planning-depth treatment. Within each distance, independently vary
# graph size and branching while holding the transposition target fixed.
max_actions_per_traj: 8

custom_envs:
  Geography-Train-D3-N10-LowBranch:
    env_type: geography
    max_actions_per_traj: ${max_actions_per_traj}
    grid_vocab: false
    env_config:
      built_in_opponent: none
      render_mode: text
      reward_mode: counterfactual
      game_step_discount: ${game_step_discount}
      root_decision_only: false
      response_token_limit: 1024
      seed_namespace: 211
      num_nodes: 10
      min_depth: 4
      max_depth: 6
      min_branching: 1
      max_branching: 2
      transposition_rate: 0.2
      target_root_informative: true
      target_root_optimal_distance: 3
      target_root_branching: 2
      target_informative_fraction: 0.5
      generator_candidates: 1024

