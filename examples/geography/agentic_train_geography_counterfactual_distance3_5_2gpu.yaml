train_env_manager:
  max_invalid_retries_per_decision: 0
  format_penalty: -1.5
  valid_format_reward: 0.05
  # Penalty-only response shaping: no reward below 600 tokens, then a linear
  # penalty to -0.5 at the 1024-token generation cap. This scalar is combined
  # with game and format reward before full-batch normalization.
  marshal_length_reward_alpha: 0.5
  marshal_length_reward_penalty_only: true
  marshal_length_reward_min_tokens: 600
  marshal_length_reward_max_tokens: 1024
  minimax_length_penalty_beta: 0.0
  enable_length_penalty: false
  max_env_num_per_worker: 16
  env_groups: 128
  group_size: 1
  group_seed_base: 100000
  tags:
    - Geography-Train-D3-N10-LowBranch
    - Geography-Train-D3-N10-HighBranch
    - Geography-Train-D3-N14-LowBranch
    - Geography-Train-D3-N14-HighBranch
    - Geography-Train-D5-N14-LowBranch
    - Geography-Train-D5-N14-HighBranch
    - Geography-Train-D5-N18-LowBranch
    - Geography-Train-D5-N18-HighBranch
  n_groups: [16, 16, 16, 16, 16, 16, 16, 16]

val_env_manager:
  tags:
    - Geography-Val-D1-Sanity
    - Geography-Val-D3-IID
    - Geography-Val-D3-IID-P1
    - Geography-Val-D3-Relabel
    - Geography-Val-D3-Topology-OOD
    - Geography-Val-D5-HeldOut
  n_groups: [8, 8, 8, 8, 8, 8]
