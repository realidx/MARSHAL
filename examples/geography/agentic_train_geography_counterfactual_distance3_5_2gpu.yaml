# @package _global_

defaults:
  - agentic_train_geography_counterfactual_distance3_2gpu
  - _self_

exp_name: "geography_counterfactual_distance3_5_reinforce_stable_2gpu"

# Literature-aligned stabilization treatment: retain complete multi-turn
# self-play trajectories and one PPO epoch, while increasing each on-policy
# rollout from 32 to 128 independently generated trajectories. The inherited
# pretrain path is the clean Qwen3-4B-Instruct base model; this configuration
# deliberately does not inherit the 727065/727616 warm-start weights.
rollout_batch_size: 128
val_batch_size: 384
resume_from_checkpoint: false
ppo_epochs: 1
adv_estimator: reinforce

# Preserve exact solved Q(s,a) as the unstandardized game advantage. Format
# and length controls are centered separately across rollout samples so they
# cannot rescale or reverse the strategic signal.
preserve_counterfactual_game_advantage: true
skip_policy_update_if_no_valid_actions: true
reward_normalization:
  grouping: tags
  method: identity
  separate_norm_for_selfplay: false
whiten_rewards: false
advantage_norm: ~
whiten_advantages: false

# Keep KL as a separate differentiable loss. It remains active when the
# zero-valid guard suppresses the reward-driven policy gradient.
add_token_level_kl: false
use_kl_loss: true
kl_loss_coef: 0.20

# Make one pass over each rollout in eight effective minibatches of 16. This
# keeps the update count used by 727616 while each update now averages four
# times as many fresh trajectories (16 rather than 4).
actor_train:
  training_args:
    gradient_accumulation_steps: 16
expected_actor_optimizer_steps_per_rollout: 8

# Run one fresh 100-step treatment from the base model. With the pipeline's
# zero-based checkpoint naming, save_steps=100 writes the final checkpoint-99.
max_steps: 100
save_steps: 100

# Balanced planning-depth treatment. Within each distance, independently vary
# graph size and branching while holding the transposition target fixed.
max_actions_per_traj: 8

custom_envs:
  Geography-Train-D3-N10-LowBranch:
    env_type: geography
    max_actions_per_traj: ${max_actions_per_traj}
    grid_vocab: false
    env_config:
      built_in_opponent: none
      render_mode: text
      reward_mode: counterfactual
      game_step_discount: ${game_step_discount}
      root_decision_only: false
      response_token_limit: 1024
      seed_namespace: 211
      num_nodes: 10
      min_depth: 4
      max_depth: 6
      min_branching: 1
      max_branching: 2
      transposition_rate: 0.2
      target_root_informative: true
      target_root_optimal_distance: 3
      target_root_branching: 2
      target_informative_fraction: 0.5
      generator_candidates: 1024

