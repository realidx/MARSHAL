# @package _global_

defaults:
  - agentic_train_geography_counterfactual_distance3_2gpu
  - _self_

exp_name: "geography_counterfactual_distance3_5_marshal_stable_2gpu"

# MARSHAL-style stabilization arm. The exact counterfactual value remains the
# game component, but normalization is applied after game, format, and length
# components have been combined. One normalization batch contains 128 fresh
# on-policy decisions; this is not gradient accumulation over four batches.
rollout_batch_size: 128
preserve_counterfactual_game_advantage: false
skip_policy_update_if_no_valid_actions: true
reward_normalization:
  grouping: batch
  method: mean_std
  separate_norm_for_selfplay: false
whiten_rewards: false
advantage_norm: ~
whiten_advantages: false

# Keep KL as a separate differentiable loss. It remains active when the
# zero-valid guard suppresses the reward-driven policy gradient.
add_token_level_kl: false
use_kl_loss: true
kl_loss_coef: 0.20

# Preserve the previous number of optimizer updates per pipeline step while
# increasing the rollout/normalization batch from 32 to 128.
actor_train:
  training_args:
    gradient_accumulation_steps: 16

# Make the intended full-run horizon explicit so the cosine schedule does not
# decay to zero at step 100.
max_steps: 200
save_steps: 100

# Balanced planning-depth treatment. Within each distance, independently vary
# graph size and branching while holding the transposition target fixed.
max_actions_per_traj: 8

custom_envs:
  Geography-Train-D3-N10-LowBranch:
    env_type: geography
    max_actions_per_traj: ${max_actions_per_traj}
    grid_vocab: false
    env_config:
      built_in_opponent: none
      render_mode: text
      reward_mode: counterfactual
      game_step_discount: ${game_step_discount}
      root_decision_only: false
      response_token_limit: 1024
      seed_namespace: 211
      num_nodes: 10
      min_depth: 4
      max_depth: 6
      min_branching: 1
      max_branching: 2
      transposition_rate: 0.2
      target_root_informative: true
      target_root_optimal_distance: 3
      target_root_branching: 2
      target_informative_fraction: 0.5
      generator_candidates: 1024

