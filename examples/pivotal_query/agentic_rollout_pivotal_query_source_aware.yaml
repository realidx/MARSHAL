defaults:
  - /tictactoe/agentic_train_tictactoe_minimax_selfplay_2gpu@_global_
  - _self_

hydra:
  searchpath:
    - file://${oc.env:PWD}/examples

exp_name: "pivotal_query_source_aware_zero_shot"
pretrain: ${oc.env:EVAL_MODEL_DIR}
max_steps: 1
rollout_batch_size: 240
sequence_length: 4096
max_actions_per_traj: 8
num_gpus_per_node: 1
actor_train:
  device_mapping: list(range(0,1))
reference:
  device_mapping: list(range(0,1))
actor_infer:
  generating_args:
    max_new_tokens: 1024
    top_p: 0.8
    top_k: 20
    num_beams: 1
    temperature: 0.7
    num_return_sequences: 1
    stop: ["</answer>"]
    include_stop_str_in_output: true
  strategy_args:
    strategy_config:
      tensor_parallel_size: 1
      max_model_len: 4096
      gpu_memory_utilization: 0.8
  device_mapping: list(range(0,1))
enable_think: true
markovian_turn_context: true
use_reason_answer_format: true
custom_envs:
  PivotalSource-Who:
    env_type: pivotal_query
    max_actions_per_traj: 8
    grid_vocab: false
    env_config: {condition: who_query, decision_rule_hint: false, max_queries: 3, response_token_limit: 128}
  PivotalSource-Retry:
    env_type: pivotal_query
    max_actions_per_traj: 8
    grid_vocab: false
    env_config: {condition: retry_after_unknown, decision_rule_hint: false, max_queries: 3, response_token_limit: 128}
  PivotalSource-Necessary:
    env_type: pivotal_query
    max_actions_per_traj: 8
    grid_vocab: false
    env_config: {condition: ask_necessary, decision_rule_hint: false, max_queries: 3, response_token_limit: 128}
  PivotalSource-Irrelevant:
    env_type: pivotal_query
    max_actions_per_traj: 8
    grid_vocab: false
    env_config: {condition: irrelevant_uncertainty, decision_rule_hint: false, max_queries: 3, response_token_limit: 128}
  PivotalSource-Known:
    env_type: pivotal_query
    max_actions_per_traj: 8
    grid_vocab: false
    env_config: {condition: known_pivotal, decision_rule_hint: false, max_queries: 3, response_token_limit: 128}
  PivotalSource-Costly:
    env_type: pivotal_query
    max_actions_per_traj: 8
    grid_vocab: false
    env_config: {condition: costly_query, decision_rule_hint: false, max_queries: 3, response_token_limit: 128}
train_env_manager:
  max_invalid_retries_per_decision: 0
  format_penalty: 0.0
  minimax_length_penalty_beta: 0.0
  enable_length_penalty: false
  max_env_num_per_worker: 80
  env_groups: 40
  group_size: 4
  group_seed_base: 830000
  tags: [PivotalSource-Who, PivotalSource-Retry, PivotalSource-Necessary, PivotalSource-Irrelevant, PivotalSource-Known, PivotalSource-Costly]
  n_groups: [8, 8, 8, 8, 4, 4]
