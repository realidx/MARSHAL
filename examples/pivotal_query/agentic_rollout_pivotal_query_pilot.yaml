defaults:
  - /tictactoe/agentic_train_tictactoe_minimax_selfplay_2gpu@_global_
  - _self_

hydra:
  searchpath:
    - file://${oc.env:PWD}/examples

exp_name: "pivotal_query_rollout_pilot"
pretrain: ${oc.env:EVAL_MODEL_DIR}

# Evaluation-only matched pilot: 10 matched families x 4 conditions, with eight
# stochastic responses to each condition-specific prompt (320 trajectories).
max_steps: 1
rollout_batch_size: 320
sequence_length: 4096
max_actions_per_traj: 8
num_gpus_per_node: 1

actor_train:
  device_mapping: list(range(0,1))

reference:
  device_mapping: list(range(0,1))

actor_infer:
  generating_args:
    # The runtime injects the opening <answer> tag. The model only emits one
    # symbolic action plus </answer>; 128 tokens is a generous protocol budget.
    max_new_tokens: 128
    top_p: 0.8
    top_k: 20
    num_beams: 1
    temperature: 0.7
    num_return_sequences: 1
    stop: ["</answer>"]
    include_stop_str_in_output: true
  strategy_args:
    strategy_config:
      tensor_parallel_size: 1
      max_model_len: 4096
      gpu_memory_utilization: 0.8
  device_mapping: list(range(0,1))

enable_think: false
markovian_turn_context: true
use_reason_answer_format: false

custom_envs:
  PivotalQuery-Known:
    env_type: pivotal_query
    max_actions_per_traj: 8
    grid_vocab: false
    env_config:
      condition: known_pivotal
      response_token_limit: 128

  PivotalQuery-Necessary:
    env_type: pivotal_query
    max_actions_per_traj: 8
    grid_vocab: false
    env_config:
      condition: ask_necessary
      seed_offset: -10
      response_token_limit: 128

  PivotalQuery-Costly:
    env_type: pivotal_query
    max_actions_per_traj: 8
    grid_vocab: false
    env_config:
      condition: costly_query
      seed_offset: -20
      response_token_limit: 128

  PivotalQuery-Irrelevant:
    env_type: pivotal_query
    max_actions_per_traj: 8
    grid_vocab: false
    env_config:
      condition: irrelevant_uncertainty
      seed_offset: -30
      response_token_limit: 128

train_env_manager:
  max_invalid_retries_per_decision: 0
  format_penalty: 0.0
  minimax_length_penalty_beta: 0.0
  enable_length_penalty: false
  max_env_num_per_worker: 80
  env_groups: 40
  group_size: 8
  group_seed_base: 800000
  tags:
    - PivotalQuery-Known
    - PivotalQuery-Necessary
    - PivotalQuery-Costly
    - PivotalQuery-Irrelevant
  n_groups: [10, 10, 10, 10]
