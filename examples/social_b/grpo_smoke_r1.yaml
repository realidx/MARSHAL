defaults:
  - ../config/deepspeed_zero3_cpuoffload@_here_
  - _self_
hydra:
  run:
    dir: .
  output_subdir: null
exp_name: social_b_grpo_vllm_r1
seed: 20260912
output_dir: outputs/social_b_grpo_vllm_r1
logging_dir: outputs/social_b_grpo_vllm_r1/logs
track_with: stdout
checkpoint_config:
  type: file_system
  output_dir: outputs/social_b_grpo_vllm_r1/checkpoints
num_gpus_per_node: 4
max_steps: 10
save_steps: 5
eval_steps: 5
logging_steps: 1
resume_from_checkpoint: false
rollout_batch_size: 4
val_batch_size: 4
prompt_length: 4096
response_length: 1024
num_return_sequences_in_group: 8
generate_opt_level: 1
is_num_return_sequences_expand: false
max_running_requests: 4
is_use_additional_prompts: false
ppo_epochs: 1
adv_estimator: grpo
pg_clip: 0.2
whiten_advantages: false
reward_shift: false
reward_norm: null
reward_clip: 10.0
max_len_mask: false
difficulty_mask: false
error_max_len_clip: false
use_kl_loss: true
kl_loss_coef: 0.01
init_kl_coef: 0.0
add_token_level_kl: false
sft_loss_coef: 0.0
entropy_loss_coef: 0.0
loss_agg_mode: seq-mean-token-mean
pretrain: /raid/chenjiahao/mas/models/Qwen3-4B-Instruct-2507
system_envs:
  CUDA_HOME: /home/chenjiahao/cuda-11.8
  LD_LIBRARY_PATH: /raid/chenjiahao/conda_envs/mas/lib
  LD_PRELOAD: /raid/chenjiahao/mas/new/local_data/b_grpo_runtime/nccl_cu11/lib/libnccl.so.2
  NCCL_CUMEM_ENABLE: '0'
  NCCL_NVLS_ENABLE: '0'
  VLLM_USE_V1: '0'
  VLLM_ATTENTION_BACKEND: XFORMERS
  TRITON_PTXAS_PATH: /home/chenjiahao/cuda-11.8/bin/ptxas
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
actor_train:
  model_args:
    attn_implementation: sdpa
    disable_gradient_checkpointing: false
    dtype: bf16
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0.0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    warmup_steps: 0
  data_args:
    template: native
    file_name: [new/local_data/social_runs/b_grpo_data_v1/train.jsonl]
    domain_interleave_probs: {social_b: 1.0}
    preprocessing_num_workers: 1
  strategy_args:
    strategy_name: deepspeed_train
    strategy_config: ${deepspeed_zero3_cpuoffload}
  device_mapping: '[0,1]'
  infer_batch_size: 1
actor_infer:
  model_args:
    dtype: bf16
  generating_args:
    max_new_tokens: 1024
    temperature: 0.7
    top_p: 1.0
    top_k: -1
    repetition_penalty: 1.0
    num_beams: 1
    num_return_sequences: 8
  data_args:
    template: native
  strategy_args:
    strategy_name: vllm
    strategy_config:
      engine_mode: sync
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.65
      max_model_len: 5120
      enforce_eager: true
      enable_prefix_caching: false
      enable_sleep_mode: false
      distributed_executor_backend: ray
  device_mapping: '[2,3]'
  infer_batch_size: 1
reference:
  model_args:
    dtype: bf16
    attn_implementation: sdpa
    device_map: 'cuda:0'
  data_args:
    template: native
  strategy_args:
    strategy_name: hf_infer
  device_mapping: '[0,1]'
  infer_batch_size: 1
validation:
  data_args:
    template: native
    file_name: [new/local_data/social_runs/b_grpo_data_v1/validation.jsonl]
    preprocessing_num_workers: 1
  generating_args:
    max_new_tokens: 1024
    temperature: 0.7
    top_p: 1.0
    top_k: -1
    repetition_penalty: 1.0
    num_return_sequences: 1
  eval_steps: 5
rewards:
  social_b:
    worker_cls: training.b_sft.social_b_reward_worker.SocialBRewardWorker
    model_args:
      model_name_or_path: ${pretrain}
    tag_included: [social_b]
    world_size: 2
    infer_batch_size: 1
    query_filter_config:
      type: no_filter
