defaults:
  - agentic_train_tictactoe_minimax_selfplay_2gpu
  - _self_

exp_name: "tictactoe_minimax_counterfactual_selfplay_2gpu_no_reasoning"

# No chain-of-thought control: generate only the short action envelope.
enable_think: false
sequence_length: 4096

actor_infer:
  generating_args:
    max_new_tokens: 64
  strategy_args:
    strategy_config:
      max_model_len: 4096
