defaults:
  - agentic_val_tictactoe_selfplay
  - _self_

# Exact perfect-information counterfactual-credit experiment. Self-play chooses
# the state distribution; precomputed Q* values evaluate each acting player's
# decision independently of the sampled continuation and eventual winner.
exp_name: "tictactoe_minimax_counterfactual_selfplay"
pretrain: /home/e/e1300530/models/Qwen3-4B-Instruct-2507/


adv_estimator: reinforce
use_turn_scores: true

# gamma remains one at token level. game_step_discount defines the horizon
# preference inside Q*; counterfactual decision rewards are not accumulated
# across later self-play actions.
gamma: 1.0
game_step_discount: 0.9

# Preserve the raw, unstandardized counterfactual decision credit.
reward_normalization:
  grouping: tags
  method: identity
  separate_norm_for_selfplay: false
whiten_rewards: false
whiten_advantages: false
advantage_norm: ~

# Give every generated attempt approximately equal policy-loss weight,
# independent of response length.
loss_agg_mode: seq-mean-token-mean

# Keep the original MARSHAL actor learning rate. The lower-rate diagnostic
# delayed but did not remove the role-specific reward collapse.
actor_train:
  training_args:
    learning_rate: 1.0e-6

# Concise non-thinking reason/answer protocol; capped responses are never force-completed.
actor_infer:
  generating_args:
    max_new_tokens: 600
    stop: ["</answer>"]
    include_stop_str_in_output: true
# Generate and train each decision from the current state only. Training emits
# each generation attempt (including a failed attempt and its retry) as a
# separate on-policy sample using the exact generation-message snapshot.
markovian_turn_context: true
enable_think: false
use_reason_answer_format: true

# Keep KL as a separate loss rather than mixing it into the game reward.
add_token_level_kl: false
use_kl_loss: true

custom_envs:
  TicTacToe:
    env_type: tictactoe
    max_actions_per_traj: ${max_actions_per_traj}
    grid_vocab: false
    env_config:
      built_in_opponent: none
      render_mode: text
      response_token_limit: 600
      reward_mode: minimax_counterfactual
      minimax_discount: ${game_step_discount}
      precompute_minimax: true

  # Keep evaluation rewards unchanged while reporting the same exact regret
  # diagnostics against the built-in opponents.
  TicTacToe-first-100:
    env_config:
      minimax_diagnostics: true
      minimax_discount: ${game_step_discount}
      precompute_minimax: true
  TicTacToe-second-100:
    env_config:
      minimax_diagnostics: true
      minimax_discount: ${game_step_discount}
      precompute_minimax: true
  TicTacToe-first-1000:
    env_config:
      minimax_diagnostics: true
      minimax_discount: ${game_step_discount}
      precompute_minimax: true
  TicTacToe-second-1000:
    env_config:
      minimax_diagnostics: true
      minimax_discount: ${game_step_discount}
      precompute_minimax: true

train_env_manager:
  # Invalid output is an auxiliary control failure, not canonical game utility.
  # Keep it substantially stronger than the length regularizer but on the same
  # order as the minimax game signal.
  format_penalty: -1.0
  # For every attempt, valid or invalid: no length pressure through 400 tokens;
  # then apply token-local costs that sum linearly to -0.1 at the 600-token cap.
  minimax_length_penalty_beta: 0.1
  minimax_length_soft_budget: 400
  minimax_length_hard_budget: 600
  max_invalid_retries_per_decision: 1
  enable_length_penalty: false

val_env_manager:
  format_penalty: 0.0
  enable_length_penalty: false
  max_env_num_per_worker: 32
  env_groups: 128
  group_size: 1
  tags:
    - TicTacToe-first-100
    - TicTacToe-second-100
    - TicTacToe-first-1000
    - TicTacToe-second-1000
  n_groups: [32, 32, 32, 32]
