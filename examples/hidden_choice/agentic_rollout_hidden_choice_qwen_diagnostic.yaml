defaults:
  - /tictactoe/agentic_train_tictactoe_minimax_selfplay_2gpu@_global_
  - _self_

hydra:
  searchpath:
    - file://${oc.env:PWD}/examples

exp_name: "hidden_choice_qwen_zero_shot_diagnostic"
pretrain: ${oc.env:EVAL_MODEL_DIR}

# 5 matched families x 4 samples x 4 conditions x 3 |Delta| levels x
# hidden/full information = 480 zero-shot trajectories. No RL or SFT occurs.
max_steps: 1
rollout_batch_size: 480
sequence_length: 4096
max_actions_per_traj: 2
num_gpus_per_node: 1

actor_train:
  device_mapping: list(range(0,1))
reference:
  device_mapping: list(range(0,1))
actor_infer:
  generating_args:
    # Shared reasoning + final-envelope budget.
    max_new_tokens: 1024
    top_p: 0.8
    top_k: 20
    num_beams: 1
    temperature: 0.7
    num_return_sequences: 1
    stop: ["</answer>"]
    include_stop_str_in_output: true
  strategy_args:
    strategy_config:
      tensor_parallel_size: 1
      max_model_len: 4096
      gpu_memory_utilization: 0.8
  device_mapping: list(range(0,1))

enable_think: true
markovian_turn_context: true
use_reason_answer_format: true

custom_envs:
  HC-Near-NoQuery-Hidden:
    env_type: hidden_choice
    max_actions_per_traj: 2
    grid_vocab: false
    env_config: {condition: no_query, margin_magnitude: 0.05, response_token_limit: 128}
  HC-Near-NoQuery-Full:
    env_type: hidden_choice
    max_actions_per_traj: 2
    grid_vocab: false
    env_config: {condition: no_query, margin_magnitude: 0.05, full_information: true, seed_offset: -5, response_token_limit: 128}
  HC-Near-Necessary-Hidden:
    env_type: hidden_choice
    max_actions_per_traj: 2
    grid_vocab: false
    env_config: {condition: necessary_query, margin_magnitude: 0.05, seed_offset: -10, response_token_limit: 128}
  HC-Near-Necessary-Full:
    env_type: hidden_choice
    max_actions_per_traj: 2
    grid_vocab: false
