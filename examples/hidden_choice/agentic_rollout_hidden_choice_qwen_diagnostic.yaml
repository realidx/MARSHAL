  HC-Near-Irrelevant-Hidden:
    env_type: hidden_choice
    max_actions_per_traj: 2
    grid_vocab: false
    env_config: {condition: irrelevant_uncertainty, margin_magnitude: 0.05, seed_offset: -20, response_token_limit: 128}
  HC-Near-Irrelevant-Full:
    env_type: hidden_choice
    max_actions_per_traj: 2
    grid_vocab: false
