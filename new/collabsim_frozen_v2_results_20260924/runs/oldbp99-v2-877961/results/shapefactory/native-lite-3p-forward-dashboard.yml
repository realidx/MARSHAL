action_space:
  enabled:
  - message
  - produce_shape
  - propose_trade_offer
  - trade_response
  - cancel_trade_offer
  - fulfill_order
  - do_nothing
controls:
  communication:
    mode: direct
task:
  type: shapefactory
  peer_economic_dashboard: true
  target_steps: 100000
  starting_money: 200
  regular_cost: 40
  specialty_cost: 15
  min_trade_price: 15
  max_trade_price: 100
  incentive_money: 60
  max_production_num: 3
  shapes_order: 1
  shapes_types: 3
  shape_options:
  - square
  - triangle
  - circle
  specialties:
    A: circle
    B: square
    C: triangle
protocol:
  turn_taking: simultaneous
  step_mode: time
  agent_trigger_interval_sec: 10
  produce_shape_delay_sec: 30
  termination:
    condition: time_elapsed
    noop_consecutive_cycles: 3
  max_concurrent_requests: 6
probe:
  cadence: per_agent_n_actions
  every_n_actions: 5
  templates:
  - grounding_v1
  questions_path: prompts/interview_questions_shape_factory_daytrader.json
logging:
